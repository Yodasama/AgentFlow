[workspace]
members = [
  "crates/agentflow-core",
  "crates/agentflow-mock-cli",
  "crates/agentflow-runner",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
libc = "0.2"
rusqlite = "0.40.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
